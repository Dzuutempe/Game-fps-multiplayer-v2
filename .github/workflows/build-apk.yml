name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Susun struktur proyek
        run: |
          if [ -f app-build.gradle ]; then
            mkdir -p app/src/main/java/com/arenafps app/src/main/assets/public app/src/main/res/drawable
            mv ./*.java app/src/main/java/com/arenafps/
            mv AndroidManifest.xml app/src/main/
            mv launcher.html app/src/main/assets/
            mv index.html game.js map.js app/src/main/assets/public/
            for f in models3d.js mapdata.js; do [ -f $f ] && mv $f app/src/main/assets/public/; done || true
            if [ -f ic_launcher.png ]; then mv ic_launcher.png app/src/main/res/drawable/; else mv ic_launcher.xml app/src/main/res/drawable/; fi
            mv app-build.gradle app/build.gradle
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: ArenaFPS-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
