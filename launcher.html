<script>
(function(){
  var $=function(i){return document.getElementById(i);};
  function err(t){ $('err').textContent=t||''; }
  try{ var m=/err=([^&]*)/.exec(location.hash); if(m) err(decodeURIComponent(m[1])); }catch(e){}
  try{ $('ip').value=localStorage.getItem('lastip')||''; }catch(e){}
  if(!window.Android){ err('Halaman ini harus dibuka lewat aplikasi.'); }
  function seg(id, def){
    var box=$(id), val=def;
    Array.prototype.forEach.call(box.children,function(b){
      b.onclick=function(){ val=+b.getAttribute('data-v'); Array.prototype.forEach.call(box.children,function(c){c.className=c.className.replace(' on','');}); b.className+=' on'; };
    });
    return function(){ return val; };
  }
  function segS(id, def){
    var box=$(id), val=def;
    Array.prototype.forEach.call(box.children,function(b){
      b.onclick=function(){ val=b.getAttribute('data-v'); Array.prototype.forEach.call(box.children,function(c){c.className=c.className.replace(' on','');}); b.className+=' on'; };
    });
    return function(){ return val; };
  }
  var mapA=segS('s-map','kota'), mapB=segS('r-map','kota');
  var botsA=seg('s-bots',3), diffA=seg('s-diff',1), killsA=seg('s-kills',15);
  var botsB=seg('r-bots',0), diffB=seg('r-diff',1), killsB=seg('r-kills',15);
  var tabs=document.querySelectorAll('nav button');
  Array.prototype.forEach.call(tabs,function(b){
    b.onclick=function(){
      Array.prototype.forEach.call(document.querySelectorAll('.pane'),function(x){x.className='pane';});
      $('p-'+b.getAttribute('data-p')).className='pane on'; err('');
    };
  });
  function host(bots,diff,kills,map){
    var r; try{ r=JSON.parse(Android.startHost(JSON.stringify({bots:bots,diff:diff,kills:kills,map:map}))); }catch(e){ err('Gagal menyalakan server.'); return null; }
    if(!r.ok){ err('Gagal menyalakan server: '+r.error); return null; }
    return r;
  }
  $('go-bot').onclick=function(){ err(''); if(!host(botsA(),diffA(),killsA(),mapA())) return; Android.enterHost(); };
  $('go-room').onclick=function(){
    err(''); var r=host(botsB(),diffB(),killsB(),mapB()); if(!r) return;
    var box=$('addrs'); box.innerHTML='';
    if(!r.ips.length){ var p=document.createElement('div'); p.className='addr'; p.style.fontSize='calc(var(--u)*30)'; p.textContent='IP tidak terdeteksi. Cek Pengaturan > WiFi, port '+r.port; box.appendChild(p); }
    else r.ips.forEach(function(ip){ var d=document.createElement('div'); d.className='addr'; d.textContent=ip+(r.port===3000?'':':'+r.port); box.appendChild(d); });
    $('setup').style.display='none'; $('info').style.display='block';
  };
  $('enter').onclick=function(){ Android.enterHost(); };
  $('go-join').onclick=function(){
    var v=$('ip').value.trim(); if(!v){ err('Isi alamat host dulu.'); return; }
    try{ localStorage.setItem('lastip',v); }catch(e){}
    err(''); Android.join(v);
  };
})();
</script>
