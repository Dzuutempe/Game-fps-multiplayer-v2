  :root{--u:min(calc(100vh/896),calc(100vw/2000*1.0));--sans:ArenaF,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;color:#fff;font-family:var(--sans);font-weight:800;font-style:italic;background:#454545}
  .stage{position:fixed;left:0;top:0;width:100%;height:100%}
  .ab{position:absolute;height:auto;display:block}
  .panel{position:absolute;left:0;top:calc(var(--u)*226.1);width:calc(var(--u)*1627.7);height:calc(var(--u)*628.9);background:#535353;border-radius:0 calc(var(--u)*47) calc(var(--u)*47) 0}
  nav button{position:absolute;width:calc(var(--u)*366.2);height:calc(var(--u)*64.3);border:0;border-radius:calc(var(--u)*20);background:#626262;padding:0;color:#fff}
  nav button.on{background:#828282}
  .lb{position:absolute;left:50%;top:50%;height:auto;transform:translate(-50%,-50%)}
  .pane{display:none;position:absolute;inset:0;pointer-events:none}
  .pane *{pointer-events:auto}
  #info,#setup{position:absolute;inset:0;pointer-events:none}
  .pane.on{display:block}
  .ob{position:absolute;border:0;background:#626262;color:#fff;padding:0;font:inherit;font-size:calc(var(--u)*34);cursor:pointer}
  .ob.on,.ob.mulai{background:#828282}
  .ob span{position:relative}
  .ob.mulai span{font-size:calc(var(--u)*30);text-transform:uppercase}
  .ob:active,nav button:active{filter:brightness(.88)}
  .note{position:absolute;left:calc(var(--u)*60);top:calc(var(--u)*600);width:calc(var(--u)*1100);margin:0;font-size:calc(var(--u)*26);line-height:1.45;font-style:normal;font-family:system-ui,Roboto,Arial,sans-serif;font-weight:700;color:#e6e6e6}
  input{position:absolute;left:calc(var(--u)*913);top:calc(var(--u)*260);width:calc(var(--u)*671);height:calc(var(--u)*92);border:0;border-radius:calc(var(--u)*28);background:#626262;color:#fff;font:inherit;font-size:calc(var(--u)*40);text-align:center;outline:none;-webkit-user-select:text;user-select:text}
  input::placeholder{color:rgba(255,255,255,.5)}
  #info{display:none}
  .addrs{position:absolute;left:calc(var(--u)*60);top:calc(var(--u)*260);width:calc(var(--u)*1100)}
  .addr{font-family:ui-monospace,Menlo,Consolas,monospace;font-style:normal;font-size:calc(var(--u)*56);font-weight:800;color:#fff;margin:0 0 calc(var(--u)*6);word-break:break-all}
  #err{position:absolute;left:calc(var(--u)*40);top:calc(var(--u)*800);margin:0;font-size:calc(var(--u)*26);color:#fff;font-style:normal;font-family:system-ui,Roboto,Arial,sans-serif}
  #err:not(:empty){background:#6b6b6b;border-radius:calc(var(--u)*16);padding:calc(var(--u)*8) calc(var(--u)*26)}

<script>
(function(){
  var $=function(i){return document.getElementById(i);};
  function err(t){ $('err').textContent=t||''; }
  try{ var m=/err=([^&]*)/.exec(location.hash); if(m) err(decodeURIComponent(m[1])); }catch(e){}
  try{ $('ip').value=localStorage.getItem('lastip')||''; }catch(e){}
  if(!window.Android){ err('Halaman ini harus dibuka lewat aplikasi.'); }
  function seg(id, items, def){
    var box=$(id), val=def;
    Array.prototype.forEach.call(box.children,function(b){
      b.onclick=function(){ val=+b.getAttribute('data-v'); Array.prototype.forEach.call(box.children,function(c){c.className='ob';}); b.className='ob on'; };
    });
    return function(){ return val; };
  }
  var D=[['Mudah',0],['Sedang',1],['Sulit',2]];
  var K=[['10',10],['15',15],['25',25]];
  var botsA=seg('s-bots',[['1',1],['3',3],['5',5],['8',8]],5), diffA=seg('s-diff',D,1), killsA=seg('s-kills',K,15);
  var botsB=seg('r-bots',[['0',0],['2',2],['4',4],['6',6]],0), diffB=seg('r-diff',D,1), killsB=seg('r-kills',K,15);
  Array.prototype.forEach.call(document.querySelectorAll('nav button'),function(b){
    b.onclick=function(){
      Array.prototype.forEach.call(document.querySelectorAll('nav button'),function(x){x.className='';});
      Array.prototype.forEach.call(document.querySelectorAll('.pane'),function(x){x.className='pane';});
      b.className='on'; $('p-'+b.getAttribute('data-p')).className='pane on'; err('');
    };
  });
  function host(bots,diff,kills){
    var r; try{ r=JSON.parse(Android.startHost(JSON.stringify({bots:bots,diff:diff,kills:kills}))); }catch(e){ err('Gagal menyalakan server.'); return null; }
    if(!r.ok){ err('Gagal menyalakan server: '+r.error); return null; }
    return r;
  }
  $('go-bot').onclick=function(){ err(''); if(!host(botsA(),diffA(),killsA())) return; Android.enterHost(); };
  $('go-room').onclick=function(){
    err(''); var r=host(botsB(),diffB(),killsB()); if(!r) return;
    var box=$('addrs'); box.innerHTML='';
    if(!r.ips.length){ var p=document.createElement('div'); p.className='addr'; p.style.fontSize='calc(var(--u)*30)'; p.textContent='IP tidak terdeteksi. Cek Pengaturan > WiFi, port '+r.port; box.appendChild(p); }
    else r.ips.forEach(function(ip){ var d=document.createElement('div'); d.className='addr'; d.textContent=ip+(r.port===3000?'':':'+r.port); box.appendChild(d); });
    $('setup').style.display='none'; $('info').style.display='block';
  };
  $('enter').onclick=function(){ Android.enterHost(); };
  $('go-join').onclick=function(){
    var v=$('ip').value.trim(); if(!v){ err('Isi alamat host dulu.'); return; }
    try{ localStorage.setItem('lastip',v); }catch(e){}
    err(''); Android.join(v);
  };
})();
